  faq:
    - question: What is ProjectWise Manage?
      answer: >
        ProjectWise Manage is the entry-level cloud collaboration platform that
        provides web-based viewing, markup, and basic document management for
        construction projects. It's ideal for teams that need simple model
        viewing and collaboration without advanced BIM coordination features.
    - question: Does ProjectWise work with Revit and Autocad Files?
      answer: >
        ProjectWise Manage has full support for BIM and CAD formats including
        Revit (.rvt), IFC, DWG, DXF, DGN and PDF files.
    - question: How is ProjectWise Manage different from Synchro 4D?
      answer: >
        ProjectWise Manage is focused on viewing and basic collaboration, while
        Synchro 4D includes advanced features like model federation, clash
        detection, 4D/5D BIM workflows, ISO 19650 compliance, and enterprise
        document control. Manage is perfect for smaller teams or external
        stakeholders who need view-only or basic markup capabilities.
    - question: Do I need to install any software?
      answer: >
        No, ProjectWise Manage is entirely web-based. You only need a modern web
        browser (Chrome, Firefox, Safari, or Edge) and an internet connection to
        access your projects.
    - question: Can external consultants and clients access ProjectWise Manage?
      answer: >
        Yes, ProjectWise Manage is ideal for granting access to external
        stakeholders. You can invite consultants, clients, or contractors with
        controlled permissions, allowing them to view and comment without full
        project access.

