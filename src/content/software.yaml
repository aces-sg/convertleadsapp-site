  faq:
    - question: What is the Bimeco IFC Viewer?
      answer: >
        The Bimeco IFC Viewer is a free, web-based tool for viewing, validating,
        and collaborating on IFC (Industry Foundation Classes) files. It's
        specifically designed for CORENET X submissions and OpenBIM workflows in
        Singapore, providing automated quality checks and multi-party
        coordination features.
    - question: What file formats does the IFC Viewer support?
      answer: >
        The viewer supports IFC 2x3, IFC4, and IFC+SG formats, which are the
        industry-standard formats for BIM model exchange. You can upload IFC
        files exported from Revit, ArchiCAD, Tekla, OpenBuildings, and other
        major BIM authoring tools.
    - question: How does CORENET X validation work?
      answer: >
        Our automated validation engine checks your IFC files against CORENET X
        submission requirements, including mandatory IFC+SG parameters outlined
        in the [industry mapping files](/blog/corenetx-vs-corenet2). The
        validator highlights missing or incorrect data, helping you fix issues
        before official submission.
    - question:
        What is the difference between the Bimeco IFC Viewer and other Free IFC
        viewers?
      answer: >
        The Bimeco IFC Viewer is completely web-based and free, unlike most
        desktop IFC viewers that require installation. It includes
        Singapore-specific CORENET X and IFC+SG validation—features rarely found
        in generic viewers—plus collaboration tools built for consultants,
        engineers, and contractors.
    - question: Can the Bimeco Validator modify BIM files?
      answer: >
        Industry Foundation Classes (IFC) is designed as a read-only file
        format. The Bimeco Validator is not designed to modify model geometry.
        However, it can be used to assign missing IFC+SG parameters to the BIM
        model before submission to CORENET X.
