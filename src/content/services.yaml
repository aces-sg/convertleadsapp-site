  howItWorksProcess: null
  toolsTechnologies: null
  portfolio: null
  ctaSection: null
  faq:
    - question: Why is IFC+SG compliance required?
      answer: >
        IFC+SG ensures that BIM data follows a consistent, open standard
        mandated by Singapore authorities. By using IFC+SG, submissions can be
        validated automatically, reducing manual checks and accelerating the
        approval timeline.

    - question: What types of BIM deliverables are required?
      answer: >
        Typically, submissions include federated BIM models from disciplines
        such as architecture, structural, and MEP. These models must be
        coordinated and clash-free. Specific agencies may also require
        accompanying 2D deliverables.

    - question: What happens if a submission is not compliant?
      answer: >
        Non-compliant submissions may result in Written Directions for
        correction, leading to project delays. Ensuring IFC+SG compliance
        smooths the approval process.

    - question: Do I need to submit via CORENET X?
      answer: >
        Yes. From October 2025, all new projects above 30,000 sqm must submit
        BIM deliverables through the CORENET X platform. For details on the
        transition from CORENET 2.0 to CORENET X, see <a
        href="/blog/corenetx-vs-corenet2">CORENET X vs CORENET 2.0</a>.

    - question: Can your BIM Coordinators perform a submission for me?
      answer: >
        Only Qualified Persons are allowed to access the CORENET X portal for
        submission. While our BIM Coordinators can assist with model
        development, ultimate responsibility lies with the Qualified Person.

