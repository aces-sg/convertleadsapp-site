      - id: vdc
        title: Virtual Design & Planning
        content: >
          4D BIM simulates construction sequences, helping teams visualize
          scheduling clashes and optimize site activities. Implement automated
          quantity takeoffs with 5D BIM for accurate cost tracking and payment
