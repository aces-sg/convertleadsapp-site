      Practical applications of drone technology in construction and operations
      management workflows.
    sections:
      - id: digital-terrain
        title: Digital Terrain Models for Planning
        src: drone-terrain.png
        content: >
          Generate accurate overviews of existing site conditions to support
          construction and master planning. Overlay BIM models onto
          drone-captured terrain data to assess design suitability against
          real-world conditions— reducing the need to send teams of engineers on
          site.
        bgColor: bg-white

      - id: progress-tracking
        title: Construction Progress Tracking
        src: drone-construction-site.png
        content: >
          Document project milestones with overhead drone flights at predefined
          intervals. Capture visual records of site progress that can be
          submitted as supporting evidence for payment claims and stakeholder
          reporting.
        bgColor: bg-white

  howItWorksProcess:
    title: Our Drone Survey Workflow
    description: >
      From site planning to data delivery, we ensure quality aerial survey
      results.
    steps:
      - number: '1'
        title: Site Planning & Permits
        description: >
          We assess flight zones, prepare ground control points (GCPs), and
          submit all required permits to CAAS. Flight plans are coordinated
          around site constraints and airspace restrictions.
        icon: ShareIcon
      - number: '2'
        title: Data Capture
        description: >
          Our certified pilots conduct UAV flights capturing high-resolution
          imagery using drone photogrammetry. Multiple overlapping images ensure
          complete site coverage.
        icon: ModelIcon
      - number: '3'
        title: Processing & Delivery
        description: >
          Raw imagery is processed into orthophotos, point clouds, 3D meshes,
          and digital terrain models. Deliverables are provided in your
          preferred BIM/CAD/GIS formats.
        icon: ReviewIcon
  faq:
    - question: Can you conduct drone surveys in Singapore?
      answer: >
        Yes. For commercial drone surveys in Singapore, a UA Operator Permit
        (OP), a Class 1 Activity Permit (AP1) for each flight, and an Unmanned
        Aircraft Pilot Licence (UAPL) (or Basic Training Certificate, if
        eligible) are required. Our certified operators manage all permit
        applications on your behalf.

    - question: What types of surveys can drones perform?
      answer: >
        Drones are suitable for topographic mapping, construction progress
        monitoring, volumetric stockpile analysis, and environmental or site
        condition surveys.

    - question: What outputs will I receive?
      answer: >
        Deliverables commonly include high-resolution orthophotos, point clouds
        (LAS/PLY/E57), 3D meshes, and BIM/CAD/GIS-compatible formats such as
        DWG, DXF, and GeoTIFF.

    - question: Can the drone survey data be linked to my BIM model?
      answer: >
        Yes. Point clouds, digital terrain models, and other drone-derived data
        can be federated seamlessly into your BIM environment for coordination
        and analysis.
