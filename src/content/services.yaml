  faq:
    - question: How long does the process take?
      answer: >
        A typical LiDAR scanning and interior modeling project takes 2–4 weeks
        from scan to BIM. However, larger project sites will naturally take a
        longer time.
    - question: Can these models be used in AR/VR presentations?
      answer: >
        Yes, BIM models can be exported to web-compatible formats like .gltf.
        This can be useful when preparing immersive presentations for your
        project teams.
    - question: What accuracy can I expect from LiDAR scans?
      answer: >
        LiDAR scans typically achieve 4–10mm accuracy, depending on the
        equipment and site conditions.
    - question: How much does it cost to scan my project site?
      answer: >
        The cost depends on the size and complexity of the site. Please provide
        an estimated Gross Floor Area (GFA) for a quote.
    - question: What is the Level of Detail of the deliverable?
      answer: >
        LOD 300 is the most-requested level of detail because it accurately
        captures the geometric dimensions of the as-built asset.
    - question: What is the file format of the final BIM deliverable?
      answer: >
        The default format is .ifc, but we can also provide models in native
        formats such as .rvt, .dgn, or .pln upon request.
    - question: Can you capture above-ceiling MEP systems?
      answer: >
        Yes, but this typically increases the cost due to the additional labor
        required to remove ceiling boards. Providing existing CAD or BIM plans
        can help reduce time and cost for above-ceiling scans.
    - question: What are the use cases for point cloud scanning?
      answer: >
        Point cloud scans are used for renovation planning, defect detection,
        as-built BIM documentation, and project visualization.

