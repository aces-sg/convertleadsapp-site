        come from native CAD files with proper layering and dimensioning. We can
        also work from scanned drawings, though this may require additional
        cleanup time.
    - question: What Level of Detail (LOD) do you model to?
      answer: >
        The appropriate LOD is dependent on the nature of the project. For
        website showcases, a high level of detail is better for impressing
        potential customers. For Architecture, Engineering, and Construction
        (AEC) workflows, the required LOD may vary based on the project stage,
        with LOD 300 for Conceptual Design, to LOD 400 for Fabrication &
        Assembly.
