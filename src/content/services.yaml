  howItWorksProcess: null
  toolsTechnologies: null
  portfolio: null
  ctaSection: null
  faq:
    - question: What is the difference between BIM and IDD?
      answer: >
        BIM refers to the creation of 3D models for design, construction, and
        operations. IDD is a broader approach that uses digital technologies to
        improve construction productivity. This may include BIM, point clouds,
        LiDAR scanners, or robotics.

    - question: What are the main elements of IDD?
      answer: >
        IDD includes BIM workflows like 4D/5D/6D modeling, automated quantity
        takeoffs, and digital twin development. It also covers non-BIM tools
        such as point clouds for progress checks and as-built verification.

    - question: Is Scan-to-BIM included in your scope of work?
      answer: >
        Our BIM services cover 4D/5D/6D workflows. For Scan-to-BIM, we
        collaborate with licensed surveyors to ensure accuracy and compliance.

    - question: Is IDD mandatory in Singapore projects?
      answer: >
        BCA actively promotes IDD as part of industry transformation. While BIM
        submissions via <a href="/blog/corenetx-vs-corenet2">CORENET X</a> are
        required, IDD itself is not yet mandatory.

    - question: How is IDD related to ISO 19650?
      answer: >
        ISO 19650 sets the global standard for information management. IDD
        complements it by integrating BIM and non-BIM workflows in a structured,
        collaborative way.
