- jobId: bim-coordinator-2025-01
  title: BIM Coordinator
  department: digital-delivery
  location: Singapore
  type: Full-Time
  level: Mid-Level
  salary: $4,500 - $6,500
  posted: '2025-01-15'
  expires: '2025-03-31'
  status: active
  description: |
    Join our team as a BIM Coordinator and contribute to major infrastructure and building projects across Singapore. You will be responsible for coordinating multi-discipline BIM models, conducting clash detection, and preparing shop drawings for project submissions. This role offers excellent opportunities to work on diverse projects including rail, road, and building developments.
  responsibilities:
    - Coordinate multi-discipline BIM models (Architecture, Structure, MEP) for
      infrastructure and building projects
    - Conduct clash detection using Navisworks and prepare detailed clash
      reports
    - Prepare shop drawings, tender drawings, and submission packages for
      authority approval
    - Attend coordination meetings with consultants, main contractors, and
      stakeholders
    - Ensure BIM models comply with project BIM Execution Plans (BEP) and
      standards
    - Support BIM Managers with model quality checks and progress reporting
  requirements:
    - Minimum 2 years of BIM coordination experience in Singapore construction
