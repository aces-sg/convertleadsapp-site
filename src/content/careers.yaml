    - Proficient in Autodesk Revit (Architecture, Structure, or MEP)
    - Experience with Navisworks for clash detection and coordination
    - Strong understanding of AutoCAD for 2D drafting and amendments
    - Experience with rail, road, or infrastructure projects preferred
    - Diploma or Degree in Civil Engineering, Architecture, or related field
    - Good communication skills and ability to work in a team environment
  skills:
