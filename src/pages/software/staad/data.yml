price_includs:
  - Advanced Structural Analysis
  - Develop Analytical Model from 3D
  - Steel Drawings Production
  - 30-Day Payment Terms

benefits:
  - title: Multi-Material Structural Design
    text:
      Design steel, concrete, timber, aluminum, and cold-formed steel structures
      anywhere in the world using included international design codes,
      regardless of which STAAD option you choose. Plus you can produce
      automated steel drawings directly from STAAD mode.
    icon: '/icons/optimization.svg'
    image: '/software/staad-pro-analytics.png'
    id: 'bnf-analysis'

  - title: Advanced Structural Analytics
    text:
      STAAD undergoes the most demanding quality and testing program. Our
      procedures follow the requirements of 10CFR Part 50 Appendix B, 10CFR Part
      21 and ASME NQA-1, which means STAAD has been approved for use on the
      design of nuclear power installations. STAAD offers many types of analysis
      ranging from finite element analysis to more complex seismic analysis.
    icon: '/icons/materials.svg'
    image: '/software/staad-pro-fea.png'

  - title: Multi-discipline Collaboration
    text:
      Streamline multi-discipline team collaboration through broad
      interoperability with Bentley desktop and cloud and mobile applications
      like OpenBuildings Designer, AutoPIPE, Revit, and Tekla. Optimize concrete
      and steel BIM workflows with the full integration of physical members and
      surfaces. View and edit models from mobile devices.
    icon: '/icons/interoperability.svg'
    image: '/software/staad-pro-synchronize.png'

features:
  - title: RAM Connection
    icon: /icons/load-analysis.svg
    text:
      Joints defined in the model with the forces calculated from the analysis
      can be passed into the leading connection design application
  - title: Bentley AutoPIPE
    icon: /icons/design-codes.svg
    text:
      Pass the STAAD.Pro structural steel frame into AutoPIPE to correctly
      account for the pipe support stiffnesses and import the pipe engineers
      support reactions back into the model
  - title: ProStructures and OpenBuildings Designer
    icon: /icons/materials.svg
    text:
      Two-way link to support creating models with design and construction
      documents
  - title: CAD & DXF
    icon: /icons/optimization.svg
    text: Use CAD models as the base wire frame
  - title: Parametric Modelling
    icon: /icons/parametric.svg
    text:
      Create parametric 3D models to explore various design alternatives and
      scenarios.
  - title: Interoperability with BIM Tools
    icon: /icons/bim-tools.svg
    text:
      Import and export designs between STAAD.Pro and leading BIM tools for
      seamless collaboration.

