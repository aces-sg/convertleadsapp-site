requirments:
  - device: Processor
    req: Intel® or AMD® processor 1.0 GHz or greater
  - device: Memory
    req: 16 GB minimum, 32 GB recommended
  - device: Hard Disk
    req: 24 GB free disk space
  - device: Graphics
    req: A dedicated graphics card with 1 GB VRAM or higher
  - device: Screen Resolution
    req: 1920 x 1080 or higher recommended

