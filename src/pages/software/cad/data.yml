  - title: 3D Modeling and Visualization
    text:
      Develop models in real context with a wide range of 3D modeling tools.
      Build and edit curve, surface, mesh, feature, and solids models. Build
      functional and parametric components with predefined variations to
      simplify managing and finding many similar components.
    textShort:
      Develop models in real context with a wide range of 3D modeling tools.
      Build and edit curve, surface, mesh, feature, and solids models.
    icon: '/icons/Icon-3.svg'
    image: '/microstation/image_26.webp'
