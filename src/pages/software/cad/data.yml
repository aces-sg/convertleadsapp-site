  - title: Interoperability
    text:
      MicroStation supports a wide range of file formats including DWG, DXF, DGN
      (native format), IFC, STEP, IGES, STL, and many others. It is also known
      for its excellent interoperability, allowing smooth integration with BIM,
      GIS, and other point cloud and photogrammetry software.
    textShort:
      Import a large variety of file formats, including DWG, DXF, DGN, IFC,
      STEP, IGES, STL, and other BIM formats.
