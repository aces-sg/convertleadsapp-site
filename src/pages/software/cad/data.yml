additional_features:
  - title: Design Development in 2D & 3D
    features:
      - name: CAD Compability
        description:
          Easily read, share, and consume precise data in key industry formats
          such as Autodesk®’s RealDWG™ (share and consume), IFC (read), Esri SHP
          (read), and more. Aggregate and assemble multiple file formats
          including PDF, U3D, 3DS, Rhino 3DM, IGES, Parasolid, ACIS SAT, CGM,
          STEP AP203/AP214, STL, OBJ, VRMLWorld, SketchUp SKP, and Collada.
      - name: Model in 3D
        description:
          Develop models in real context with a wide range of 3D modeling tools.
          Build and edit curve, surface, mesh, feature, and solids models. Build
          functional and parametric components with predefined variations to
          simplify managing and finding many similar components.
      - name: Develop 2D Documentation
        description:
          Develop precise drawings using a comprehensive set of drafting tools
          to efficiently create 2D geometry. Rapidly progress your designs from
          concept to completion using persistent constraints to maintain your
          design intent.
      - name: Model Visualization & Analysis
        description:
          Communicate your design intent with MicroStation’s visualization
          capabilities and increase the buy-in for your project across all
          stakeholders. MicroStation can analyze and visualize models based on
          their geometry or attributes. You can detect and resolve clashes, as
          well as analyze real-world solar exposure and shading. Real-time
          display styles can be applied to visualize models based on each
          object’s height, slope, aspect angle, and other embedded properties.
      - name: Component Management
        description:
          MicroStation allows you to create and use smart parametric objects
          with pre-defined variants so that you can have fewer objects in your
          library to search through and manage. They also include the 3D and
          various 2D representations of those objects and can be managed and
          shared via cloud services with project teams along with any associated
          documents, such as specifications.
  - title: Incorporate Real-world Context
    features:
      - name: Geospatially Locate Projects
        description:
          Integrate geospatial information from hundreds of supported coordinate
          systems into your designs. Access data from OGC Web Map Servers, use
          realtime GPS data, Microsoft Bing maps, and create and reference
          geospatial PDFs.
      - name: Incorporate Referenced Design Content
        description:
          View and work with design information from others in real-time using
          live referencing of 2D/3D DGN, DWG, and large image files, refreshed
          on demand. You can even natively reference PDF files into your
          designs.
      - name: Integrate Point Clouds
        description:
          Easily incorporate a wide range and scale of point-cloud data into the
          design environment. Visualize, render, and measure point-cloud data to
          better understand existing conditions and speed dimensioning and
          modeling.
      - name: Integrate Raster Imagery
        description:
          Easily incorporate raster imagery of all types, including aerial and
          satellite imagery, and scanned documents. Choose from dozens of
          supported file formats including CALS, BMP, TIF, GeoTIFF, JPG, and
          many more.
      - name: Integrate Reality Meshes
        description:
          Incorporate realistic, photo-textured 3D models or reality meshes into
          your designs. These highly realistic models can be used directly in
          the design environment as the basis for your design and construction
          modeling for faster and better-quality models.

  - title: Collaboration Workflow
    features:
      - name: Version Control & Design History
        description:
          View and track changes made to the design, as well as who made the
          changes and when. If needed, you can restore changes to a prior state
          using the design history capability. Gone are the worries about
          constantly saving every change you have made to your file.
          MicroStation can do it for you.
      - name: Create Animations for Presentation
        description:
          Create lifelike visualizations using a built-in VUE Rendering engine.
          Use online and delivered libraries of physically correct materials,
          lighting, and rich photorealistic content (RPC). Get results faster
          with distributed network rendering.
      - name: Review Designs Collaboratively
        description:
          Work in real-time with your project team members reviewing/tracking/
          resolving with the Issue Resolution Service. Identify, assign, and
          review the progress of revisions and changes for any type of issue
          that arises in the model.
      - name: Maintain CAD Standards
        description:
          Ensure the proper application of organizational and project specific
          standards. Apply templates to control geometry and data standards such
          as styles for dimensions, text, lines, detail symbols, and more. Once
          designs are complete, use automated tools to check drawings for
          standards compliance.
      - name: Data Security
        description:
          Ensure that only certain individuals can view and/or edit files. You
          can ensure the integrity of your documents using digital signatures
          and control the digital rights to view, edit, print, and copy file
          contents, including a pre-defined expiration date when the file can be
          accessed
