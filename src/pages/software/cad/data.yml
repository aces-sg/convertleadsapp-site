benefits:
  - title: 2D Drafting Tools
    text:
      MicroStation excels in 2D and 3D precision drawing with tools for detailed
      drafting and annotations. Its AccuDraw and AccuSnap features enable highly
      accurate positioning of objects, while providing advanced dimensioning and
      snapping capabilities, allowing users to create designs with exact
      measurements.
    textShort:
      Develop precise drawings using a comprehensive set of drafting tools to
      efficiently create 2D geometry.
    icon: '/icons/Inbox.svg'
    image: '/microstation/image30.png'
