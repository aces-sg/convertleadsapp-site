<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" rx="8" fill="white" stroke="#E5E7EB"/>
  <rect x="40" y="40" width="120" height="20" rx="4" fill="#FBDA05"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#000">Dashboard</text>
  <rect x="180" y="40" width="80" height="20" rx="4" fill="#E5E7EB"/>
  <text x="190" y="52" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Reports</text>
  <rect x="280" y="40" width="80" height="20" rx="4" fill="#E5E7EB"/>
  <text x="290" y="52" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Analytics</text>
  
  <!-- Main Dashboard -->
  <rect x="20" y="100" width="760" height="480" rx="8" fill="white" stroke="#E5E7EB"/>
  
  <!-- Title -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Maintenance Dashboard &amp; Statistics</text>
  
  <!-- KPI Cards Row 1 -->
  <g transform="translate(40, 150)">
    <!-- MTBF Card -->
    <rect x="0" y="0" width="170" height="100" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Mean Time Between Failures</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#10B981">720</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">hours</text>
    <g transform="translate(130, 20)">
      <path d="M0 15 L20 5 L20 25 Z" fill="#10B981"/>
      <text x="25" y="20" font-family="Arial, sans-serif" font-size="10" fill="#10B981">+5.2%</text>
    </g>
    
    <!-- MTTR Card -->
    <rect x="190" y="0" width="170" height="100" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="210" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Mean Time To Repair</text>
    <text x="210" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FBDA05">2.5</text>
    <text x="210" y="70" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">hours</text>
    <g transform="translate(320, 20)">
      <path d="M0 5 L20 15 L0 25 Z" fill="#EF4444"/>
      <text x="25" y="20" font-family="Arial, sans-serif" font-size="10" fill="#EF4444">-1.8%</text>
    </g>
    
    <!-- Uptime Card -->
    <rect x="380" y="0" width="170" height="100" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="400" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">System Uptime</text>
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#10B981">98.5%</text>
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">this month</text>
    <g transform="translate(510, 20)">
      <path d="M0 15 L20 5 L20 25 Z" fill="#10B981"/>
      <text x="25" y="20" font-family="Arial, sans-serif" font-size="10" fill="#10B981">+0.3%</text>
    </g>
    
    <!-- Cost Savings Card -->
    <rect x="570" y="0" width="150" height="100" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="590" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Cost Savings</text>
    <text x="590" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#10B981">$12K</text>
    <text x="590" y="70" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">this month</text>
    <g transform="translate(650, 20)">
      <path d="M0 15 L20 5 L20 25 Z" fill="#10B981"/>
      <text x="25" y="20" font-family="Arial, sans-serif" font-size="10" fill="#10B981">+15%</text>
    </g>
  </g>
  
  <!-- Charts Section -->
  <g transform="translate(40, 270)">
    <!-- Maintenance Trends Chart -->
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Maintenance Trends</text>
    
    <!-- Chart Area -->
    <rect x="20" y="40" width="300" height="120" fill="white" stroke="#E5E7EB"/>
    
    <!-- Chart Lines -->
    <g transform="translate(20, 40)">
      <!-- Grid lines -->
      <line x1="0" y1="30" x2="300" y2="30" stroke="#F3F4F6"/>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#F3F4F6"/>
      <line x1="0" y1="90" x2="300" y2="90" stroke="#F3F4F6"/>
      
      <!-- Preventive maintenance line -->
      <polyline points="0,90 75,75 150,60 225,45 300,30" fill="none" stroke="#10B981" stroke-width="2"/>
      <circle cx="0" cy="90" r="3" fill="#10B981"/>
      <circle cx="75" cy="75" r="3" fill="#10B981"/>
      <circle cx="150" cy="60" r="3" fill="#10B981"/>
      <circle cx="225" cy="45" r="3" fill="#10B981"/>
      <circle cx="300" cy="30" r="3" fill="#10B981"/>
      
      <!-- Reactive maintenance line -->
      <polyline points="0,60 75,70 150,80 225,75 300,65" fill="none" stroke="#EF4444" stroke-width="2"/>
      <circle cx="0" cy="60" r="3" fill="#EF4444"/>
      <circle cx="75" cy="70" r="3" fill="#EF4444"/>
      <circle cx="150" cy="80" r="3" fill="#EF4444"/>
      <circle cx="225" cy="75" r="3" fill="#EF4444"/>
      <circle cx="300" cy="65" r="3" fill="#EF4444"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(20, 170)">
      <circle cx="0" cy="0" r="4" fill="#10B981"/>
      <text x="10" y="5" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Preventive</text>
      <circle cx="80" cy="0" r="4" fill="#EF4444"/>
      <text x="90" y="5" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Reactive</text>
    </g>
    
    <!-- Equipment Performance Chart -->
    <rect x="360" y="0" width="360" height="180" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="380" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Equipment Performance</text>
    
    <!-- Performance Bars -->
    <g transform="translate(380, 40)">
      <!-- Equipment A -->
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Conveyor A1</text>
      <rect x="80" y="5" width="200" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="80" y="5" width="180" height="12" rx="6" fill="#10B981"/>
      <text x="290" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">90%</text>
      
      <!-- Equipment B -->
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Pump B2</text>
      <rect x="80" y="25" width="200" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="80" y="25" width="150" height="12" rx="6" fill="#FBDA05"/>
      <text x="290" y="35" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">75%</text>
      
      <!-- Equipment C -->
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Motor C3</text>
      <rect x="80" y="45" width="200" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="80" y="45" width="190" height="12" rx="6" fill="#10B981"/>
      <text x="290" y="55" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">95%</text>
      
      <!-- Equipment D -->
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">System D4</text>
      <rect x="80" y="65" width="200" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="80" y="65" width="120" height="12" rx="6" fill="#EF4444"/>
      <text x="290" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">60%</text>
      
      <!-- Equipment E -->
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Line E5</text>
      <rect x="80" y="85" width="200" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="80" y="85" width="170" height="12" rx="6" fill="#10B981"/>
      <text x="290" y="95" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">85%</text>
    </g>
    
    <!-- Performance Legend -->
    <g transform="translate(380, 150)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#10B981"/>
      <text x="20" y="10" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Good (&gt;80%)</text>
      <rect x="80" y="0" width="12" height="12" rx="2" fill="#FBDA05"/>
      <text x="100" y="10" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Warning (60-80%)</text>
      <rect x="180" y="0" width="12" height="12" rx="2" fill="#EF4444"/>
      <text x="200" y="10" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Critical (&lt;60%)</text>
    </g>
  </g>
  
  <!-- Custom KPI Section -->
  <g transform="translate(40, 470)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Custom KPIs</text>
    <rect x="150" y="5" width="100" height="25" rx="4" fill="#FBDA05"/>
    <text x="175" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#000">+ Add KPI</text>
    
    <!-- Sample Custom KPIs -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="150" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Energy Efficiency</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">92.3%</text>
      
      <rect x="160" y="0" width="150" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
      <text x="170" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Parts Inventory</text>
      <text x="170" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FBDA05">$45K</text>
      
      <rect x="320" y="0" width="150" height="40" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
      <text x="330" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Work Orders</text>
      <text x="330" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">127</text>
    </g>
  </g>
  
  <!-- Auto-refresh indicator -->
  <g transform="translate(720, 130)">
    <circle cx="0" cy="0" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" fill="#10B981">Auto-refresh</text>
  </g>
</svg>
