# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY {
  globalAuthRule: AuthRule = { allow: public }
} # FOR TESTING ONLY!
type Todo @model {
  id: ID!
}

type Mutation {
  triggerNotification(input: String): String
    @function(name: "bimformsubmission-${env}")
  subscribeMailchimp(input: SubscribeMailchimpInput): String
    @function(name: "mailchimpSubscription-${env}")
}

type ExternalUser
  @model
  @auth(
    rules: [
      { allow: public, operations: [create, update, delete, read] }
    ]
  ) {
  id: ID!
  name: String!
  title: String
  role: String!
  company: String
  companyLogoUrl: String
  discipline: String
  registration_date: AWSDate
  registration_branch: String
  registration_number: String
  email: AWSEmail!
    @index(
      name: "byEmail"
      queryField: "externalUserByEmail"
      sortKeyFields: ["createdAt"]
    )
  linkedin: String
  telephone: String
  skills: [String]
  imageUrl: String
  status: Boolean
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type BTO @model {
  id: ID!
  name: String
  estate: String
  type: String
  floorPlanUrl: String
  brochureUrl: String
  model3DUrl: String
  status: Boolean
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

input SubscribeMailchimpInput {
  email: String!
  name: String!
}
